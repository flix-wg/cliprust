[package]
name = "cliprust"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Low-memory clipboard history for macOS: Rust core and CLI with SQLite FTS5 search"
license = "MIT"
repository = "https://github.com/flix-wg/cliprust"
readme = "README.md"
keywords = ["clipboard", "clipboard-manager", "macos", "sqlite", "cli"]
categories = ["command-line-utilities", "os::macos-apis"]
publish = false

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
clap = { version = "4.6.8", features = ["derive", "env"] }
clipboard-rs = { version = "0.3.5", default-features = false }
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
lzfse_rust = { version = "0.2.1", optional = true }
plist = { version = "1.10.4", default-features = false, optional = true }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-perl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = { version = "3.27", optional = true }
thiserror = "2.0.21"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
zeroize = "1.9.2"
zstd = "0.14.4"

# SQLCipher (with CommonCrypto) only where the master key can live in the Keychain.
[target.'cfg(not(target_os = "macos"))'.dependencies]
rusqlite = { version = "0.43.0", features = ["bundled", "functions"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace", "NSRunningApplication", "NSPasteboard", "libc"] }
objc2-foundation = "0.3.2"
rusqlite = { version = "0.43.0", features = ["bundled-sqlcipher", "functions"] }
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[features]
default = ["pastenow-import"]
pastenow-import = ["dep:lzfse_rust", "dep:plist", "dep:tempfile"]
# C ABI for the macOS app (app/).
ffi = []
