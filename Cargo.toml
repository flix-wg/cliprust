[package]
name = "cliprust"
version = "0.1.0"
edition = "2024"
description = "Low-memory clipboard history core with SQLite FTS5 search"
publish = false

[dependencies]
clap = { version = "4.6.8", features = ["derive", "env"] }
clipboard-rs = { version = "0.3.5", default-features = false }
lzfse_rust = { version = "0.2.1", optional = true }
plist = { version = "1.10.4", default-features = false, optional = true }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-perl"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
zstd = "0.14.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = "0.3.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[features]
default = ["pastenow-import"]
pastenow-import = ["dep:lzfse_rust", "dep:plist"]
